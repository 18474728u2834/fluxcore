<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>403 — Access Denied</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0d12; color: #e7eaf0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { max-width: 480px; text-align: center; }
      h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: -0.02em; }
      h2 { font-size: 20px; margin: 0 0 16px; font-weight: 600; color: #9ca3af; }
      p  { font-size: 14px; line-height: 1.55; color: #9ca3af; }
      .accent { color: #22d3ee; }
      code { background: #11141b; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>403</h1>
        <h2>Access Denied</h2>
        <p>Automated mirroring, scraping, and offline-copy tools are not permitted on <span class="accent">Fluxcore</span>.</p>
        <p>If you are a real visitor, please open the site in a standard browser. Abuse is logged and may be reported.</p>
        <p style="margin-top:24px"><code>Fluxcore Protection · UA gate</code></p>
      </div>
    </div>
  </body>
</html>
